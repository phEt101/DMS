<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/var/www/boswell-dms/dist"

    <Directory "/var/www/boswell-dms/dist">
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api
</VirtualHost>
