ServerName localhost

<VirtualHost *:8080>
    DocumentRoot "/usr/local/apache2/htdocs"

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/boswell-api(?:/|$)
        RewriteCond %{REQUEST_URI} !^/api(?:/|$)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # บีบอัดไฟล์ static (bundle หลัก ~1.8 MB → ~500 KB) ลดเวลาดาวน์โหลดเมื่อหลายคนเข้า Wi-Fi เดียวกัน
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
    </IfModule>

    # ไฟล์ใน dist มี hash ต่อท้ายแล้ว จึงแคชได้นาน ส่วน index.html ต้องตรวจใหม่ทุกครั้ง
    <IfModule mod_headers.c>
        <FilesMatch "\.(js|css|svg|png|jpg|jpeg|webp|woff2?)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <FilesMatch "\.html$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>

    ProxyPreserveHost On
    ProxyPass /boswell-api http://api:3000/boswell-api retry=0
    ProxyPassReverse /boswell-api http://api:3000/boswell-api
    ProxyPass /api http://api:3000/api retry=0
    ProxyPassReverse /api http://api:3000/api

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
